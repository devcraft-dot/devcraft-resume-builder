<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #f9fafb;
    }
    .header {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .tab-row { display: flex; gap: 4px; }
    .tab-btn {
      padding: 5px 12px; font-size: 12px; font-weight: 500;
      border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; cursor: pointer; color: #374151;
    }
    .tab-btn:hover { background: #f3f4f6; }
    .tab-btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .panel { display: none; padding: 14px 16px 16px; }
    .panel.active { display: block; }
    .field { margin-bottom: 10px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600; color: #4b5563;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .field input, .field textarea, .field select {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 13px; font-family: inherit;
    }
    .field textarea { min-height: 140px; resize: vertical; line-height: 1.4; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 4px; line-height: 1.35; }
    .controls { display: flex; gap: 8px; margin-top: 12px; }
    .controls button {
      flex: 1; padding: 10px 0; font-size: 13px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
    }
    .btn-start { background: #7c3aed; color: #fff; }
    .btn-start:hover:not(:disabled) { background: #6d28d9; }
    .btn-start:disabled { opacity: 0.45; cursor: not-allowed; }
    .status-msg {
      margin-top: 12px; font-size: 12px; padding: 10px; border-radius: 6px;
      background: #f3f4f6; color: #374151; word-break: break-word; min-height: 2.5em;
    }
    .status-msg.ok { background: #d1fae5; color: #065f46; }
    .status-msg.err { background: #fee2e2; color: #991b1b; }
    .status-msg.run { background: #ede9fe; color: #5b21b6; }
    .profile-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 10px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-title { font-weight: 600; font-size: 12px; color: #374151; }
    .btn-delete {
      border: none; background: transparent; color: #9ca3af; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0 4px;
    }
    .btn-delete:hover { color: #ef4444; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-row button {
      flex: 1; padding: 8px; font-size: 12px; font-weight: 600; border-radius: 6px;
      border: 1px solid #d1d5db; background: #fff; cursor: pointer;
    }
    .btn-row button.primary { background: #111827; color: #fff; border-color: #111827; }
    .save-status { font-size: 11px; color: #059669; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Manual JD</h1>
    <div class="tab-row">
      <button type="button" class="tab-btn active" data-tab="run">Run</button>
      <button type="button" class="tab-btn" data-tab="settings">Profiles</button>
    </div>
  </div>

  <div id="panel-run" class="panel active">
    <div class="field">
      <label for="job-title">Job title</label>
      <input id="job-title" type="text" placeholder="e.g. Senior Backend Engineer" autocomplete="off" />
    </div>
    <div class="field">
      <label for="company">Company</label>
      <input id="company" type="text" placeholder="Company name" autocomplete="organization" />
    </div>
    <div class="field">
      <label for="salary">Salary range (optional)</label>
      <input id="salary" type="text" placeholder="e.g. $150k–$180k" />
    </div>
    <div class="field">
      <label for="jd">Job description</label>
      <textarea id="jd" placeholder="Paste the full job description here…"></textarea>
    </div>
    <div class="field">
      <label for="reference-url">Posting URL (optional)</label>
      <input id="reference-url" type="url" placeholder="https://… — optional; used for de-duplication and tracking" />
      <div class="hint">If empty, the extension and server use a hash of title + company + JD + profile name (same as API).</div>
    </div>
    <div class="controls">
      <button type="button" class="btn-start" id="btn-start">Start</button>
    </div>
    <div id="status-msg" class="status-msg">Ready. Uses the same saved profiles as the Indeed extension (chrome.storage.sync &quot;profiles&quot;).</div>
  </div>

  <div id="panel-settings" class="panel">
    <p class="hint" style="margin-bottom: 10px;">Profiles are shared with the Indeed extension. Edit here or there — same storage key.</p>
    <div id="profiles-container"></div>
    <div class="btn-row">
      <button type="button" id="btn-add">Add profile</button>
      <button type="button" class="primary" id="btn-save">Save profiles</button>
      <span id="save-status" class="save-status"></span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
